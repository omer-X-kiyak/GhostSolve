<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>AI Çözücü Ayarları</title>
  <style>
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #f4f4f5;
      margin: 0;
      padding: 14px;
      font-size: 13px;
    }
    h3 { margin: 0 0 10px 0; font-size: 14px; color: #38bdf8; display: flex; justify-content: space-between; }
    .status-card {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
    }
    .badge-local { background: #059669; color: white; }
    .badge-hybrid { background: #d97706; color: white; }
    .badge-cloud { background: #2563eb; color: white; }
    label { display: block; margin-top: 8px; margin-bottom: 3px; font-weight: 500; font-size: 12px; color: #d4d4d8; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    input:focus, select:focus { outline: 1px solid #38bdf8; border-color: #38bdf8; }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 6px;
    }
    button:hover { background: #1d4ed8; }
    .scan-btn { background: #3f3f46; margin-bottom: 10px; font-size: 11px; padding: 6px; }
    .scan-btn:hover { background: #52525b; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h3>
    <span>⚡ AI Soru Çözücü</span>
    <span style="font-size: 11px; color: #a1a1aa;">v2.5</span>
  </h3>

  <div class="status-card" id="activeModelStatus">
    Modeller taranıyor...
  </div>

  <button class="scan-btn" id="btnRescan">🔄 Modelleri Yeniden Tara</button>

  <label>Çalışma Modu:</label>
  <select id="selWorkMode">
    <option value="local_only">🔒 Sadece Yerel (Açık Kaynak - Kesin Çevrimdışı)</option>
    <option value="hybrid">⚡ Hibrit (Yerel Öncelikli, Hata Verirse Bulut)</option>
    <option value="cloud_only">☁️ Sadece Bulut (Gemini / OpenAI)</option>
  </select>

  <div id="localSettings">
    <label>Kullanılacak Yerel Model:</label>
    <select id="selLocalModel"></select>
  </div>

  <div id="cloudSettings" class="hidden">
    <hr style="border: 0; border-top: 1px solid #27272a; margin: 12px 0;">
    <label>Bulut Sağlayıcı:</label>
    <select id="selProvider">
      <option value="gemini">Google Gemini</option>
      <option value="openai">OpenAI (ChatGPT)</option>
    </select>

    <label id="lblApiKey">API Anahtarı:</label>
    <input type="password" id="txtApiKey" placeholder="API anahtarı...">
  </div>

  <button id="btnSave">Ayarları Kaydet</button>

  <script src="popup.js"></script>
</body>
</html>
